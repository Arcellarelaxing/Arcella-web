!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcella Relaxing | Reservaciones</title>
    <style>
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            outline: none; border: none;
            text-decoration: none;
            text-transform: capitalize;
            transition: .2s linear;
        }
        body {
            background: #fff;
            font-family: 'Poppins', sans-serif;
        }
        .heading {
            text-align: center;
            padding-bottom: 2rem;
            color: #333;
            font-size: 3rem;
        }
        .heading span {
            color: #d1a3a4;
        }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            background: #d1a3a4;
            color: #fff;
            padding: .6rem 2.5rem;
            cursor: pointer;
            font-size: 1.5rem;
            border-radius: .5rem;
        }
        .btn:hover {
            background: #333;
        }
        .book .row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }
        .book .row .image {
            flex: 1 1 40rem;
        }
        .book .row .image img {
            width: 100%;
        }
        .book .row form {
            flex: 1 1 40rem;
            padding: 2rem;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.1);
            border-radius: .5rem;
            border: .1rem solid rgba(0,0,0,.1);
        }
        .book .row form .box {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            color: #333;
            margin: .6rem 0;
            border: .1rem solid rgba(0,0,0,.1);
            border-radius: .5rem;
            background: #f7f7f7;
        }
        .book .row form .box:focus {
            border-color: #d1a3a4;
        }
    </style>
</head>
<body>

<!-- Sección de reservaciones corregida para Netlify -->
<section class="book" id="book">

    <h1 class="heading"> <span>Reserve</span> su espacio </h1>    

    <div class="row">
        <form name="reservaciones" method="POST" data-netlify="true">
            
            <input type="text" name="nombre" placeholder="Nombre completo" class="box" required>
            <input type="email" name="correo" placeholder="Correo electrónico" class="box" required>
            <input type="number" name="telefono" placeholder="Número de teléfono" class="box" required>
            <input type="date" name="fecha" class="box" required>
            <input type="time" name="hora" class="box" required>

            <select name="servicio" class="box" required>
                <option value="" disabled selected>Seleccione el Servicio</option>
                <option value="facial">Tratamiento Facial</option>
                <option value="masaje">Masaje Relajante</option>
                <option value="corporal">Tratamiento Corporal</option>
            </select>

            <button type="submit" class="btn">Solicitar Reservacion</button>

        </form>
    </div>

</section>

</body>
</html>
