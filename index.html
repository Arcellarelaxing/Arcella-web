
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcella Relaxing | Reservaciones</title>
<style>
:root {
  --mar: #159eaa;
  --oscuro: #087681;
  --fondo: #effbfb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px 12px;
  font-family: Arial, sans-serif;
  color: #24484b;
  background: linear-gradient(180deg, #d9f5f4, #fff);
}
main {
  max-width: 440px;
  margin: auto;
  padding: 22px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 22px #08768120;
}
h1 {
  margin: 0;
  color: var(--oscuro);
  text-align: center;
  font-size: 27px;
}
.subtitulo {
  text-align: center;
  color: #59888a;
  margin: 8px 0 20px;
}
label {
  display: block;
  margin: 12px 0 5px;
  font-size: 14px;
  font-weight: bold;
}
input, select {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid #b8dddd;
  border-radius: 9px;
  background: var(--fondo);
  color: #24484b;
  font-size: 16px;
}
.fechas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: var(--mar);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:active { background: var(--oscuro); }
.nota {
  text-align: center;
  font-size: 12px;
  color: #628487;
  margin: 14px 0 0;
}
</style>
</head>
<body>
<main>
  <h1>Arcella Relaxing</h1>
  <p class="subtitulo">🌊 Tu espacio de descanso en Playa del Carmen</p>

  <form id="reserva">
    <label for="nombre">Nombre completo</label>
    <input id="nombre" required autocomplete="name"
      placeholder="Tu nombre">

    <label for="correo">Correo electrónico</label>
    <input id="correo" type="email" required
      autocomplete="email" placeholder="Tu correo">

    <label for="telefono">Teléfono</label>
    <input id="telefono" type="tel" required
      autocomplete="tel" placeholder="Tu teléfono">

    <div class="fechas">
      <div>
        <label for="llegada">Entrada</label>
        <input id="llegada" type="date" required>
      </div>
      <div>
        <label for="salida">Salida</label>
        <input id="salida" type="date" required>
      </div>
    </div>

    <label for="huespedes">Número de huéspedes</label>
    <select id="huespedes" required>
      <option value="">Selecciona</option>
      <option value="1">1 huésped</option>
      <option value="2">2 huéspedes</option>
      <option value="3">3 huéspedes</option>
      <option value="4">4 huéspedes</option>
    </select>

    <button type="submit">Solicitar reservación por WhatsApp</button>
  </form>

  <p class="nota">Tu descanso comienza aquí · Arcella Relaxing</p>
</main>

<script>
const formulario = document.getElementById('reserva');
const llegada = document.getElementById('llegada');
const salida = document.getElementById('salida');

const hoy = new Date();
const fechaLocal = new Date(
  hoy.getTime() - hoy.getTimezoneOffset() * 60000
).toISOString().slice(0, 10);

llegada.min = fechaLocal;
salida.min = fechaLocal;

llegada.addEventListener('change', function () {
  salida.min = llegada.value || fechaLocal;
  if (salida.value && salida.value <= llegada.value) {
    salida.value = '';
  }
});

formulario.addEventListener('submit', function (event) {
  event.preventDefault();

  if (salida.value <= llegada.value) {
    alert('La salida debe ser posterior a la entrada.');
    return;
  }

  const nombre = document.getElementById('nombre').value.trim();
  const correo = document.getElementById('correo').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  const huespedes = document.getElementById('huespedes').value;

  const mensaje =
    'SOLICITUD DE RESERVACIÓN - ARCELLA RELAXING\n\n' +
    'Nombre: ' + nombre + '\n' +
    'Correo: ' + correo + '\n' +
    'Teléfono: ' + telefono + '\n' +
    'Fecha de entrada: ' + llegada.value + '\n' +
    'Fecha de salida: ' + salida.value + '\n' +
    'Huéspedes: ' + huespedes + '\n\n' +
    'Hola, quisiera consultar la disponibilidad.';

  /*
   * IMPORTANTE:
   * Aquí debe ir el número de WhatsApp que ya te funcionó,
   * con código de país y solo números, sin + ni espacios.
   */
  const numeroWhatsApp = 'PEGA_AQUI_TU_NUMERO';

  if (!/^\d+$/.test(numeroWhatsApp)) {
    alert('Falta configurar el número de WhatsApp en el código.');
    return;
  }

  const url = 'https://wa.me/' + numeroWhatsApp +
    '?text=' + encodeURIComponent(mensaje);

  window.open(url, '_blank');
});
</script>
</body>
</html>
