<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcella Relaxing | Reservas</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #faf6f0; color: #4a3e3d; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(140, 122, 107, 0.1); max-width: 420px; width: 100%; text-align: center; border: 1px solid #ebdccb; box-sizing: border-box; }
        h1 { color: #8c7a6b; font-size: 26px; margin-bottom: 5px; font-weight: 500; letter-spacing: 0.5px; }
        p { color: #9c8e85; font-size: 14px; margin-bottom: 30px; }
        label { display: block; text-align: left; margin: 14px 0 6px; font-weight: 600; font-size: 13px; color: #6e5d53; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #ebdccb; border-radius: 10px; box-sizing: border-box; font-size: 15px; background-color: #fdfcfb; color: #4a3e3d; outline: none; transition: border 0.3s; }
        input:focus, select:focus { border-color: #8c7a6b; }
        button { background-color: #25D366; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2); }
        button:hover { background-color: #128C7E; }
        .logo-placeholder { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-placeholder">🌸</div>
    <h1>Arcella Relaxing</h1>
    <p>Completa tus datos para solicitar tu cita de relajación</p>
    
    <label for="nombre">Nombre Completo:</label>
    <input type="text" id="nombre" placeholder="Ej. María López">

    <label for="servicio">Selecciona un Servicio:</label>
    <select id="servicio">
        <option value="Masaje Relajante">Masaje Relajante</option>
        <option value="Masaje Descontracturante">Masaje Descontracturante</option>
        <option value="Masaje con Piedras Calientes">Masaje con Piedras Calientes</option>
        <option value="Tratamiento Facial Hidratante">Tratamiento Facial Hidratante</option>
        <option value="Exfoliación Corporal">Exfoliación Corporal</option>
        <option value="Paquete Completo Spa">Paquete Completo Spa (Facial + Masaje)</option>
    </select>

    <label for="fecha">Fecha y Hora Deseada:</label>
    <input type="datetime-local" id="fecha">

    <button onclick="enviarWhatsApp()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://w3.org"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.488 1.451 5.42 1.453 5.443 0 9.874-4.422 9.877-9.866.002-2.637-1.019-5.117-2.877-6.979C17.204 1.9 14.733.882 12.016.882c-5.444 0-9.877 4.422-9.88 9.867a9.814 9.814 0 001.448 5.12l-.995 3.636 3.73-.978zm11.236-4.992c-.3-.15-1.774-.875-2.048-.974-.274-.1-.474-.15-.674.15-.2.3-.774.974-.95 1.174-.175.2-.351.224-.651.075-1.205-.6-2.016-1.129-2.825-2.517-.213-.363-.213-.67 0-.964.12-.156.3-.35.45-.525.15-.175.2-.3.3-.5s.05-.375-.025-.525C10.744 8.24 10.12 6.71 9.86 6.084c-.253-.608-.51-.525-.7-.535l-.595-.01c-.2 0-.525.075-.8.375-.275.3-1.05 1.025-1.05 2.5s1.075 2.9 1.225 3.1c.15.2 2.112 3.225 5.117 4.525.715.31 1.273.495 1.708.634.718.228 1.37.196 1.887.119.577-.087 1.774-.725 2.024-1.425.25-.7.25-1.3 0-1.425-.075-.125-.275-.2-.575-.35z"/></svg>
        Enviar Solicitud por WhatsApp
    </button>
</div>

<script>
function enviarWhatsApp() {
    const telefono = "522228630972"; 
    
    const nombre = document.getElementById('nombre').value.trim();
    const servicio = document.getElementById('servicio').value;
    const fechaInput = document.getElementById('fecha').value;

    if(!nombre || !fechaInput) {
        alert("Por favor, escribe tu nombre completo y elige una fecha/hora.");
        return;
    }

    const fechaObjeto = new Date(fechaInput);
    const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    const fechaFormateada = fechaObjeto.toLocaleDateString('es-MX', opciones);

    const texto = `¡Hola Arcella Relaxing! ✨%0AMe gustaría solicitar una reserva:%0A%0A👤 *Nombre:* ${encodeURIComponent(nombre)}%0A💆🏽‍♀️ *Servicio:* ${encodeURIComponent(servicio)}%0A📅 *Fecha y Hora:* ${encodeURIComponent(fechaFormateada)}`;
    const url = `https://wa.me{telefono}?text=${texto}`;
    
    window.open(url, '_blank');
}
</script>

</body>
</html>
