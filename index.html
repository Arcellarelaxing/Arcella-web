<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcella Relaxing | Reservaciones</title>
    <!-- Iconos para el teléfono -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            outline: none; border: none;
            text-decoration: none;
            transition: .2s linear;
        }
        body {
            background: #f4f9f9;
            font-family: 'Poppins', sans-serif;
        }
        .heading {
            text-align: center;
            padding-top: 2rem;
            padding-bottom: 1rem;
            color: #114e60;
            font-size: 2.8rem;
        }
        .heading span {
            color: #2bba9e;
        }
        /* Barra de contacto directo */
        .contacto-directo {
            text-align: center;
            font-size: 1.3rem;
            color: #114e60;
            margin-bottom: 1.5rem;
        }
        .contacto-directo a {
            color: #2bba9e;
            font-weight: bold;
            margin-left: 0.5rem;
        }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            background: #2bba9e;
            color: #fff;
            padding: .8rem 2.5rem;
            cursor: pointer;
            font-size: 1.4rem;
            border-radius: .5rem;
            text-align: center;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background: #114e60;
        }
        .book .row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .book .row form {
            flex: 1 1 40rem;
            max-width: 45rem;
            padding: 2.5rem;
            background: #ffffff;
            box-shadow: 0 .5rem 1.5rem rgba(17, 78, 96, 0.15);
            border-radius: .8rem;
            border: .1rem solid rgba(43, 186, 158, 0.2);
        }
        .book .row form .box {
            width: 100%;
            padding: 1.1rem;
            font-size: 1.2rem;
            color: #333;
            margin: .6rem 0;
            border: .1rem solid #cadedd;
            border-radius: .5rem;
            background: #fbfdfd;
        }
        .book .row form .box:focus {
            border-color: #2bba9e;
            background: #fff;
            box-shadow: 0 0 5px rgba(43, 186, 158, 0.4);
        }
        .book .row form label {
            font-size: 1.1rem;
            color: #114e60;
            display: block;
            margin-top: 0.8rem;
            font-weight: 500;
        }
        input[type="date"] {
            cursor: pointer;
            position: relative;
        }
    </style>
</head>
<body>

<section class="book" id="book">

    <h1 class="heading"> <span>Reserve</span> su Estancia </h1>    
    
    <div class="contacto-directo">
        <p><i class="fab fa-whatsapp"></i> O contáctanos directamente: <a href="https://wa.me" target="_blank">222 863 0972</a></p>
    </div>

    <div class="row">
        <!-- Modificamos el formulario para usar JavaScript y enviar a WhatsApp -->
        <form id="formReservacion" onsubmit="enviarWhatsApp(event)">
            
            <input type="text" id="nombre" placeholder="Nombre completo del huésped" class="box" required>
            <input type="email" id="correo" placeholder="Correo electrónico" class="box" required>
            <input type="number" id="telefono" placeholder="Número de teléfono de contacto" class="box" required>
            
            <label for="llegada"><i class="far fa-calendar-alt"></i> Fecha de Entrada (Check-in):</label>
            <input type="date" id="llegada" class="box" required>
            
            <label for="salida"><i class="far fa-calendar-alt"></i> Fecha de Salida (Check-out):</label>
            <input type="date" id="salida" class="box" required>

            <select id="huespedes" class="box" required>
                <option value="" disabled selected>Número de huéspedes</option>
                <option value="1">1 Huésped</option>
                <option value="2">2 Huéspedes</option>
                <option value="3">3 Huéspedes</option>
                <option value="4">4 Huéspedes</option>
                <option value="5+">5 o más Huéspedes</option>
            </select>

            <button type="submit" class="btn">Solicitar Reservación</button>

        </form>
    </div>

</section>

<script>
function enviarWhatsApp(event) {
    event.preventDefault();
    
    // Recopilar los datos del formulario
    var nombre = document.getElementById('nombre').value;
    var correo = document.getElementById('correo').value;
    var telefono = document.getElementById('telefono').value;
    var llegada = document.getElementById('llegada').value;
    var salida = document.getElementById('salida').value;
    var huespedes = document.getElementById('huespedes').value;
    
    // Tu número de WhatsApp con clave de país
    var numeroTelefono = "522228630972"; 
    
    // Construir el mensaje de texto elegante
    var mensaje = "¡Hola! Me gustaría solicitar una reservación:\n\n" +
                  "*Nombre:* " + nombre + "\n" +
                  "*Correo:* " + correo + "\n" +
                  "*Teléfono de contacto:* " + telefono + "\n" +
                  "*Fecha de entrada:* " + llegada + "\n" +
                  "*Fecha de salida:* " + salida + "\n" +
                  "*Número de huéspedes:* " + huespedes;
    
    // Codificar el texto para que la URL lo acepte
    var mensajeCodificado = encodeURIComponent(mensaje);
    
    // Crear el enlace final de WhatsApp
    var urlWhatsApp = "https://wa.me" + numeroTelefono + "?text=" + mensajeCodificado;
    
    // Redirigir al usuario inmediatamente a WhatsApp
    window.open(urlWhatsApp, '_blank');
}
</script>

</body>
</html>
